# Sales call rubric. Read by both the live coach and the post-call reviewer.
# Section ids are stable identifiers — referenced by stored scores, don't rename casually.

id: sales_v1
name: "General sales call"

# Fed to AssemblyAI as `prompt` (domain hint) and `keyterms_prompt` (vocabulary boost).
stt:
  prompt: "A sales call between a sales representative and a prospective customer. May cover pricing, plans, contracts, and objections."
  keyterms:
    - postpaid
    - prepaid
    - monthly rental
    - unlimited
    - AT&T
    - sign me up
    - no catch
    - no hidden fees

stages:
  - opening
  - discovery
  - pitch
  - objection_handling
  - close

sections:
  - id: opening_rapport
    name: "Opening & rapport"
    weight: 0.10
    rubric:
      1: "No greeting, jumps straight to pitch, doesn't confirm who they're speaking with."
      3: "Greets and identifies themselves, but rushes past rapport."
      5: "Warm, confident opening; confirms the customer's context before pitching."

  - id: discovery
    name: "Needs discovery"
    weight: 0.20
    rubric:
      1: "Asks no questions about the customer's needs or current situation."
      3: "Asks one or two surface questions, doesn't probe further."
      5: "Multiple open questions, listens, and visibly tailors the pitch to the answers."

  - id: value_pitch
    name: "Value pitch tied to needs"
    weight: 0.20
    rubric:
      1: "Generic pitch, unrelated to anything the customer said."
      3: "Pitch mentions the product but only loosely ties to stated needs."
      5: "Pitch explicitly connects features to the needs surfaced in discovery."

  - id: objection_handling
    name: "Objection handling"
    weight: 0.20
    rubric:
      1: "Ignores or talks over objections."
      3: "Acknowledges the objection but answers with a generic deflection."
      5: "Acknowledges, addresses the specific concern, confirms it's resolved."

  - id: honesty_disclosure
    name: "Honesty & disclosure"
    weight: 0.15
    rubric:
      1: "States or implies something false (e.g. 'no catch' while a cost follows)."
      3: "Discloses costs/terms only when directly asked."
      5: "Proactively and clearly discloses costs, terms, and limitations."

  - id: close_next_steps
    name: "Close & next steps"
    weight: 0.15
    rubric:
      1: "Call ends with no clear next step or ask."
      3: "Asks for the sale/commitment but next steps are vague."
      5: "Clear ask, clear next step, confirms the customer's understanding."

# Moment types the live coach and reviewer both tag onto quotes.
moment_types:
  - objection
  - buying_signal
  - pain_point
  - commitment
  - compliance_risk
  - customer_frustration

# Escalation triggers the reviewer looks for, evidence-gated (see evaluator/review/evidence.py).
escalation_triggers:
  - misrepresentation       # says something false or contradicted later in the same call
  - missing_disclosure      # never states cost/terms despite reaching a close
  - abusive_or_hostile

# Evidence-verification thresholds, shared across live and post-call.
evidence:
  min_word_confidence: 0.5
  fuzzy_match_threshold: 85     # rapidfuzz partial_ratio, 0-100
  time_window_ms: 10000         # cited timestamp must fall within this of the actual quote

# Live-coach heuristic thresholds (evaluator/signals.py reads these; LLM does not compute them).
live_thresholds:
  monologue_warn_seconds: 60
  talk_ratio_warn_pct: 65        # over the trailing window below
  talk_ratio_window_seconds: 120
  rep_silence_warn_seconds: 180  # no rep question in this long
  dead_air_warn_seconds: 3
