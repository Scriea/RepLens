[project]
name = "sales-call-evaluator"
version = "0.1.0"
description = "Live coaching + evidence-verified post-call review for sales calls, built on AssemblyAI streaming diarization"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "websockets>=13",       # AssemblyAI streaming client (owned directly, not via Pipecat — see docs/PROTOCOL.md)
  "httpx>=0.27",           # AssemblyAI batch REST + Groq (openai-compatible)
  "openai>=1.50",          # Groq via its openai-compatible endpoint
  "pydantic>=2",
  "loguru>=0.7",
  "pyyaml>=6",             # rubrics/sales.yaml
  "rapidfuzz>=3.10",       # evidence-quote fuzzy matching
  "sqlmodel>=0.0.22",
  "watchfiles>=0.24",      # calls/inbox/ watcher
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
